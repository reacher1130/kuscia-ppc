apiVersion: kuscia.secretflow/v1alpha1
kind: KusciaJob
metadata:
  name: job-ss-lr
  namespace: cross-domain
  labels:
    "kuscia.secretflow/interconn-protocol-type": "bfia"
spec:
  initiator: alice
  tasks:
    - alias: ss_lr_1
      appImage: ic-ss-lr
      parties:
        - domainID: alice
          role: host
        - domainID: bob
          role: guest
      taskInputConfig: '{"name":"ss_lr_1","module_name":"ss_lr","output":[{"type":"dataset","key":"result"}],"role":{"host":["alice"],"guest":["bob"]},"initiator":{"role":"host","node_id":"alice"},"task_params":{"host":{"0":{"has_label":true,"name":"perfect_logit_a.csv","namespace":"data"}},"guest":{"0":{"has_label":false,"name":"perfect_logit_b.csv","namespace":"data"}},"common":{"algo":"ss_lr","protocol_families":"ss","protocol":"semi2k","field":64,"fxp_bits":18,"trunc_mode":"probabilistic","shard_serialize_format":"raw","optimizer":"sgd","learning_rate":0.0001,"num_epoch":10,"batch_size":32,"last_batch_policy":"discard","l0_norm":0,"l1_norm":0,"l2_norm":0.5,"sigmoid_mode":"minimax_1","use_ttp":false,"label_owner":"host.0","skip_rows":1,"start_transport":false}}}'
      tolerable: false
